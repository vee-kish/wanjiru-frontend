<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Wanjiru Bakery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:440px; text-align:center;">
      <div class="brand" style="justify-content:center; margin-bottom:1rem;">
        <span class="brand-logo"><i class="fa-solid fa-bread-slice"></i></span>
        <span>Wanjiru Bakery</span>
      </div>

      <div style="font-size:3.4rem; color:#e0d5c4; margin-bottom:0.5rem;">
        <i class="fa-solid fa-wifi"></i>
      </div>

      <h1 style="font-size:1.5rem; margin-bottom:0.4rem;">You're currently offline</h1>
      <p class="text-muted" style="margin-bottom:1.5rem;">
        Please reconnect to the internet to create or update live supplier orders.
      </p>

      <button class="btn btn-primary" id="retryBtn" style="width:100%;">
        <i class="fa-solid fa-rotate"></i> Retry Connection
      </button>
    </div>
  </div>

  <script>
    document.getElementById("retryBtn").addEventListener("click", () => window.location.reload());
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
